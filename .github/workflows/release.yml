name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group commit build

      - name: Check version
        id: check
        run: |
          VERSION=$(cz version --project)
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "0.0.0" ] || git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.check.outputs.should_release == 'true'
        run: python -m build

      - name: Extract release notes
        if: steps.check.outputs.should_release == 'true'
        run: cz changelog --unreleased-version "${{ steps.check.outputs.tag }}" --dry-run > "$RUNNER_TEMP/RELEASE_NOTES.md"

      - name: Create GitHub Release
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.check.outputs.tag }}" dist/* \
            --target "${{ github.sha }}" \
            --title "${{ steps.check.outputs.tag }}" \
            --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md"
